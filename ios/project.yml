name: TypeShift
options:
  bundleIdPrefix: com.nayal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  TypeShift:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TypeShift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nayal.typeshift
        INFOPLIST_FILE: TypeShift/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TypeShift/TypeShift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nayal.typeshift
    dependencies: []

  TypeShiftKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TypeShiftKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nayal.typeshift.keyboard
        INFOPLIST_FILE: TypeShiftKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: TypeShiftKeyboard/TypeShiftKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nayal.typeshift
    dependencies:
      - target: TypeShift
        embed: false
