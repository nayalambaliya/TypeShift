name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained EXE
        run: >
          dotnet publish windows/TypeShift.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Rename EXE
        run: mv publish/windows/TypeShift.exe TypeShift-windows.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TypeShift-windows.exe
          body: |
            ## Installation (Windows)
            1. Download **TypeShift-windows.exe** below
            2. Run it — no install required, no .NET needed
            3. TypeShift appears in your system tray (bottom-right)
            4. Double-click the tray icon → Settings → paste your free [Groq API key](https://console.groq.com)
            5. Type any text in any app, add `?fix` (or any trigger) at the end, press Space
